<!doctype html>
<html lang="es-MX">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dos Mundos</title>
    <style>
      html, body { margin: 0; height: 100%; background: #000; color: #cfd6cf; overflow: hidden;
        font-family: 'Courier New', monospace; }
      #app { position: fixed; inset: 0; display: flex; }
      /* Oído a la izquierda, Vista a la derecha (DISENO.md §9) */
      #oido, #vista { position: relative; flex: 1 1 50%; min-width: 0; overflow: hidden; }
      #oido { border-right: 2px solid #1a1f1a; }
      .etiqueta { position: absolute; top: 8px; left: 10px; font-size: 12px; letter-spacing: 2px;
        opacity: 0.55; pointer-events: none; z-index: 2; }
      #inicio { position: fixed; inset: 0; z-index: 10; display: flex; flex-direction: column;
        align-items: center; justify-content: center; gap: 18px; background: #000; text-align: center; }
      #inicio h1 { margin: 0; font-size: 44px; letter-spacing: 8px; font-weight: normal; }
      #inicio p { margin: 0; max-width: 520px; font-size: 14px; line-height: 1.5; opacity: 0.75; }
      #inicio button { font: inherit; font-size: 18px; letter-spacing: 3px; padding: 12px 34px;
        background: #0c0f0c; color: #cfd6cf; border: 1px solid #5a665a; cursor: pointer; }
      #inicio button:hover, #fin button:hover { background: #1a201a; }
      #inicio .secundario { font-size: 13px; padding: 8px 20px; opacity: 0.8; }
      #modos { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
      #modos button { font-size: 13px; letter-spacing: 2px; padding: 8px 16px; opacity: 0.6; }
      #modos button[aria-pressed='true'] { opacity: 1; border-color: #cfd6cf; background: #1a201a; }
      /* Dos PC: cada una muestra solo su mitad, a pantalla completa. */
      body[data-modo='oido'] #vista, body[data-modo='vista'] #oido { display: none; }
      body[data-modo='oido'] #oido { border-right: 0; }
      body[data-modo='oido'] #fin, body[data-modo='vista'] #fin { left: 50%; }
      #aviso { position: fixed; top: 12px; left: 50%; transform: translateX(-50%); z-index: 8;
        max-width: 80vw; padding: 8px 16px; font-size: 13px; text-align: center;
        background: rgba(0, 0, 0, 0.85); border: 1px solid #5a665a; }
      #fin { position: fixed; bottom: 18px; left: 25%; transform: translateX(-50%); z-index: 8; }
      #fin button { font: inherit; font-size: 14px; letter-spacing: 2px; padding: 8px 20px;
        background: #0c0f0c; color: #cfd6cf; border: 1px solid #5a665a; cursor: pointer; }
      [hidden] { display: none !important; }
    </style>
  </head>
  <body>
    <div id="app">
      <section id="oido"><span class="etiqueta">OÍDO</span></section>
      <section id="vista"><span class="etiqueta">VISTA</span></section>
    </div>
    <div id="inicio">
      <h1>DOS MUNDOS</h1>
      <p>Para dos personas. Oído: ojos vendados y audífonos de diadema. Vista: frente a la cámara, sin audífonos.</p>
      <p>La cámara y el micrófono se procesan en tu equipo; no se graba ni se envía nada.</p>
      <div id="modos" role="group" aria-label="Modo de juego">
        <button type="button" data-modo="solo">UNA PC</button>
        <button type="button" data-modo="oido">DOS PC · SOY OÍDO</button>
        <button type="button" data-modo="vista">DOS PC · SOY VISTA</button>
      </div>
      <p id="nota-modo"></p>
      <button id="btn-inicio" type="button">EMPEZAR</button>
      <button id="btn-teclado" class="secundario" type="button">SIN CÁMARA NI MICRÓFONO (SOLO TECLADO)</button>
    </div>
    <div id="aviso" hidden></div>
    <div id="fin" hidden><button id="btn-reiniciar" type="button">REINTENTAR (F2)</button></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
